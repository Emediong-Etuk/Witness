name: ci
on: [push, pull_request]
permissions:
  contents: read
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Skip apt's man-db index rebuild (slow on these runners) before any apt use.
      - name: Disable man-db auto-update
        run: sudo rm -f /var/lib/man-db/auto-update
      # apt is unreliable on these runners (the Ubuntu mirror sometimes crawls: an apt
      # install of ffmpeg exceeded 8 minutes). Use a static build from GitHub releases,
      # which is fast from Actions; fall back to apt only if the download fails.
      - name: Install ffmpeg (bench + lab-recorder tests)
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
        run: |
          set -o pipefail
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then ffmpeg -version | head -1; exit 0; fi
          dir="$RUNNER_TEMP/ffmpeg"
          mkdir -p "$dir"
          if curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 "$FFMPEG_URL" | tar -xJ -C "$dir" --strip-components=1 && [ -x "$dir/bin/ffprobe" ]; then
            echo "$dir/bin" >> "$GITHUB_PATH"
            "$dir/bin/ffmpeg" -version | head -1
            "$dir/bin/ffprobe" -version | head -1
          else
            echo "Static ffmpeg download failed; falling back to apt"
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
            ffmpeg -version | head -1
          fi
      # The runner image already has Chrome's system libraries, so install only the browser.
      # `--with-deps` pulls ~32 MB of optional fonts through apt, and the Ubuntu mirror is
      # sometimes so slow on these runners that it alone exceeded 8 minutes. apt is now only a
      # fallback, used if a smoke launch shows a library is actually missing.
      - name: Install Chromium for Playwright
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          npx playwright install chromium
          if ! node -e "require('@playwright/test').chromium.launch().then(b => b.close())"; then
            echo "Chromium could not start; installing its system dependencies via apt"
            sudo -E npx playwright install-deps chromium
            node -e "require('@playwright/test').chromium.launch().then(b => b.close())"
          fi
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run verify
      - run: npm run lint:compliance
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build:desktop
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Skip apt's man-db index rebuild (slow on these runners) before any apt use.
      - name: Disable man-db auto-update
        run: sudo rm -f /var/lib/man-db/auto-update
      # The runner image already has Chrome's system libraries, so install only the browser.
      # `--with-deps` pulls ~32 MB of optional fonts through apt, and the Ubuntu mirror is
      # sometimes so slow on these runners that it alone exceeded 8 minutes. apt is now only a
      # fallback, used if a smoke launch shows a library is actually missing.
      - name: Install Chromium for Playwright
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          npx playwright install chromium
          if ! node -e "require('@playwright/test').chromium.launch().then(b => b.close())"; then
            echo "Chromium could not start; installing its system dependencies via apt"
            sudo -E npx playwright install-deps chromium
            node -e "require('@playwright/test').chromium.launch().then(b => b.close())"
          fi
      - run: npm run build:web
      - run: npm run build:site
      - run: npx playwright test --trace off
