name: ci
on: [push, pull_request]
permissions:
  contents: read
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install ffmpeg (bench + lab-recorder tests)
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then ffmpeg -version | head -1; exit 0; fi
          # The man-db index rebuild after apt installs can stall for a long time on ubuntu-24.04 runners.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run verify
      - run: npm run lint:compliance
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build:desktop
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - run: npm run build:site
      - run: npx playwright test --trace off
